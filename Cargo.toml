[package]
name = "photoes"
version = "0.1.0"
edition = "2024"
description = "A fast, minimal, AI-first photos app for Linux"
license = "GPL-3.0-or-later"
repository = "https://github.com/siliconwitch/photoes"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita" }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_12"] }
kamadak-exif = "0.6.2"
serde_json = "1.0.154"
shumate = { version = "0.8.1", package = "libshumate", features = ["v1_4"] }
soup = { version = "0.9.0", package = "soup3" }
